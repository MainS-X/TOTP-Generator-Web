<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"/>
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <link rel="icon" type="image/x-icon" href="favicon.png">

  <style>
    .container,.container-fluid{-webkit-box-sizing:border-box;box-sizing:border-box;margin-right:auto;margin-left:auto;padding-right:8px;padding-left:8px}.container-fluid::after,.container::after{display:table;clear:both;content:''}.container{width:96%;max-width:1280px}
    @media (min-width:600px){.container{width:94%}}
    @media (min-width:1024px){.container{width:92%}}
    .card-content{position:relative;padding:16px;font-size:14px;line-height:24px}
    .card-primary-title{display:block;font-size:24px;line-height:36px;opacity:.87}
    .card-primary-subtitle{display:block;font-size:14px;line-height:24px;opacity:.54}
    .typo-display-4,.typo-display-4-opacity{font-weight:300;font-size:112px;letter-spacing:-.04em}.typo-display-4-opacity{opacity:.54}
    .text-center{text-align:center!important}
    .center{display:block!important;margin-right:auto!important;margin-left:auto!important}
    .time-status{margin:4px 0 12px;font-size:13px;line-height:20px;opacity:.72}
    .time-status.warning{color:#b3261e;opacity:1}

  </style>
  <!-- MDUI CSS -->
  <link rel="stylesheet" href="https://unpkg.com/mdui@2.0.3/mdui.css">
  <!-- <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css"> -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="./font.css">
  <title>TOTP 生成器</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
  <!-- MDUI JavaScript -->
  <script src="https://unpkg.com/mdui@2.0.3/mdui.global.js"></script>
</head>
<body class="container">
  <mdui-top-app-bar>
    <mdui-top-app-bar-title>TOTP 生成器</mdui-top-app-bar-title>
    <div style="flex-grow: 1"></div>
    <mdui-tooltip content="查看 Github">
        <mdui-button-icon>
          <a href="https://github.com/SkyAerope/TOTP-Generator-Web" target="_blank">
            <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 36 36" enable-background="new 0 0 36 36" xml:space="preserve" style="width: 24px;height:24px;">
              <path fill-rule="evenodd" clip-rule="evenodd" fill="#212121" d="M18,1.4C9,1.4,1.7,8.7,1.7,17.7c0,7.2,4.7,13.3,11.1,15.5c0.8,0.1,1.1-0.4,1.1-0.8c0-0.4,0-1.4,0-2.8c-4.5,1-5.5-2.2-5.5-2.2c-0.7-1.9-1.8-2.4-1.8-2.4c-1.5-1,0.1-1,0.1-1c1.6,0.1,2.5,1.7,2.5,1.7c1.5,2.5,3.8,1.8,4.7,1.4c0.1-1.1,0.6-1.8,1-2.2c-3.6-0.4-7.4-1.8-7.4-8.1c0-1.8,0.6-3.2,1.7-4.4c-0.2-0.4-0.7-2.1,0.2-4.3c0,0,1.4-0.4,4.5,1.7c1.3-0.4,2.7-0.5,4.1-0.5c1.4,0,2.8,0.2,4.1,0.5c3.1-2.1,4.5-1.7,4.5-1.7c0.9,2.2,0.3,3.9,0.2,4.3c1,1.1,1.7,2.6,1.7,4.4c0,6.3-3.8,7.6-7.4,8c0.6,0.5,1.1,1.5,1.1,3c0,2.2,0,3.9,0,4.5c0,0.4,0.3,0.9,1.1,0.8c6.5-2.2,11.1-8.3,11.1-15.5C34.3,8.7,27,1.4,18,1.4z"></path>
            </svg>
          </a>
        </mdui-button-icon>
     </mdui-tooltip>
  </mdui-top-app-bar>

  <mdui-text-field label="输入密钥" icon="vpn_key" id="key" oninput="generateTOTP()" autofocus></mdui-text-field>

<p></p>

  <mdui-card clickable class="center" onclick="copyKey()">
    <div class="card-content">
      <div class="card-primary-title">TOTP</div>
      <div class="card-primary-subtitle">点击此卡片可复制TOTP</div>
    <p id="totp" class="typo-display-4 text-center"></p>
    <p id="remaining-time"></p>
    <p id="time-status" class="time-status" aria-live="polite">正在校准网络时间…</p>
    <mdui-linear-progress id="progress" value="0" max="100"></mdui-linear-progress>
  </div>
  </mdui-card>

  <script>
    var timerId;
    var timeSyncTimerId;
    var timeStep = 30;
    var updateInterval = 250;
    var timeSyncInterval = 5 * 60 * 1000;
    var timeSyncRetryInterval = 30 * 1000;
    var trustedClock = null;
    var timeSyncPromise = null;

    function monotonicNow() {
      if (window.performance && typeof window.performance.now === 'function') {
        return window.performance.now();
      }
      return Date.now();
    }

    // 使用服务端 Date 响应头建立可信时间锚点，密钥和验证码不会被发送出去。
    function currentTimestampMs() {
      if (!trustedClock) {
        return Date.now();
      }

      return trustedClock.epochMs + (monotonicNow() - trustedClock.monotonicMs);
    }

    function setTimeStatus(message, isWarning) {
      var status = document.getElementById('time-status');
      status.textContent = message;
      status.classList.toggle('warning', Boolean(isWarning));
    }

    function buildTimeSyncUrl() {
      var url = new URL(window.location.href);
      url.hash = '';
      url.searchParams.set('_totp_time_sync', Date.now().toString(36) + Math.random().toString(36).slice(2));
      return url.toString();
    }

    async function fetchNetworkTimeSample() {
      var startedAt = monotonicNow();
      var response = await fetch(buildTimeSyncUrl(), {
        method: 'HEAD',
        cache: 'no-store',
        credentials: 'same-origin'
      });
      var receivedAt = monotonicNow();

      if (!response.ok) {
        throw new Error('time sync request failed');
      }

      var dateHeader = response.headers.get('Date');
      var serverTimestamp = Date.parse(dateHeader || '');
      if (!Number.isFinite(serverTimestamp)) {
        throw new Error('missing server time');
      }

      var roundTripTime = Math.max(0, receivedAt - startedAt);
      return {
        // HTTP Date 精确到秒，增加 500ms 取该秒的中点，再补偿约半个往返延迟。
        epochMs: serverTimestamp + 500 + roundTripTime / 2,
        monotonicMs: receivedAt,
        roundTripTime: roundTripTime
      };
    }

    function scheduleTimeSync(delay) {
      clearTimeout(timeSyncTimerId);
      timeSyncTimerId = setTimeout(function () {
        synchronizeTime(true);
      }, delay || timeSyncInterval);
    }

    async function synchronizeTime(force) {
      var trustedClockAge = trustedClock ? monotonicNow() - trustedClock.monotonicMs : Infinity;
      var currentDeviceOffset = trustedClock ? currentTimestampMs() - Date.now() : Infinity;
      var deviceClockChanged = trustedClock
        ? Math.abs(currentDeviceOffset - trustedClock.deviceOffsetMs) >= 2000
        : true;
      if (!force && trustedClockAge < timeSyncInterval && !deviceClockChanged) {
        return true;
      }
      if (timeSyncPromise) {
        return timeSyncPromise;
      }

      setTimeStatus('正在校准网络时间…', false);
      timeSyncPromise = (async function () {
        try {
          var samples = [];
          for (var i = 0; i < 3; i++) {
            try {
              samples.push(await fetchNetworkTimeSample());
            } catch (error) {
              // 单次请求失败时继续尝试，避免临时网络波动导致校准失败。
            }
          }

          if (!samples.length) {
            throw new Error('time sync failed');
          }

          samples.sort(function (a, b) {
            return a.roundTripTime - b.roundTripTime;
          });
          trustedClock = samples[0];
          trustedClock.deviceOffsetMs = currentTimestampMs() - Date.now();

          var offsetSeconds = Math.round(trustedClock.deviceOffsetMs / 1000);
          if (Math.abs(offsetSeconds) >= 2) {
            setTimeStatus('网络时间已校准，已自动修正设备时间偏差', false);
          } else {
            setTimeStatus('网络时间已校准', false);
          }

          updateTOTP();
          scheduleNextUpdate();
          scheduleTimeSync(timeSyncInterval);
          return true;
        } catch (error) {
          if (trustedClock) {
            setTimeStatus('暂时无法重新校准，继续使用上次的网络时间', true);
          } else {
            setTimeStatus('网络时间校准失败，当前使用设备时间，请检查系统时间', true);
          }
          scheduleTimeSync(timeSyncRetryInterval);
          return Boolean(trustedClock);
        } finally {
          timeSyncPromise = null;
        }
      })();

      return timeSyncPromise;
    }

    // 始终根据传入时间重新计算，不依赖页面上缓存的验证码。
    function calculateTOTP(rawKey, timestampMs) {
      var normalizedKey = rawKey.toUpperCase().replace(/\s/g, '');
      if (!normalizedKey) {
        return { error: '' };
      }

      if (!/^[A-Z2-7]+={0,6}$/.test(normalizedKey)) {
        return { error: '密钥格式无效，请输入 Base32 密钥' };
      }

      try {
        var key = base32Decode(normalizedKey);
        var currTime = Math.floor(timestampMs / 1000);
        var message = Math.floor(currTime / timeStep).toString(16).padStart(16, '0');
        var hmacHash = hmacSHA1(key, hexToBytes(message));
        var offset = hmacHash[19] & 0xf;
        var otp =
          ((hmacHash[offset] & 0x7f) << 24) |
          (hmacHash[offset + 1] << 16) |
          (hmacHash[offset + 2] << 8) |
          hmacHash[offset + 3];

        var elapsedSeconds = (timestampMs / 1000) % timeStep;
        return {
          otp: (otp % 1000000).toString().padStart(6, '0'),
          remainingTime: Math.ceil(timeStep - elapsedSeconds),
          progress: ((timeStep - elapsedSeconds) / timeStep) * 100
        };
      } catch (error) {
        return { error: '无法生成验证码，请检查密钥' };
      }
    }

    function renderTOTP(result) {
      var totpElement = document.getElementById('totp');
      var remainingTimeElement = document.getElementById('remaining-time');
      var progress = document.getElementById('progress');

      if (!result.otp) {
        totpElement.textContent = '';
        remainingTimeElement.textContent = result.error || '';
        progress.value = 0;
        progress.style.display = 'none';
        return null;
      }

      totpElement.textContent = result.otp;
      remainingTimeElement.textContent = '剩余时间: ' + result.remainingTime + ' 秒';
      progress.style.display = 'block';
      progress.value = result.progress;
      return result.otp;
    }

    function updateTOTP() {
      var key = document.getElementById('key').value || '';
      return renderTOTP(calculateTOTP(key, currentTimestampMs()));
    }

    function scheduleNextUpdate() {
      clearTimeout(timerId);

      // 隐藏页面不依赖后台计时器；恢复可见时会由事件立即重新同步。
      if (document.hidden) {
        return;
      }

      var delay = updateInterval - (currentTimestampMs() % updateInterval) + 10;
      timerId = setTimeout(function () {
        updateTOTP();
        scheduleNextUpdate();
      }, delay);
    }

    function generateTOTP() {
      var otp = updateTOTP();
      scheduleNextUpdate();
      synchronizeTime(false);
      return otp;
    }

    function resyncTOTP() {
      generateTOTP();
    }

    function showSnackbar(message) {
      if (window.mdui && typeof window.mdui.snackbar === 'function') {
        window.mdui.snackbar({ message: message, position: 'top' });
      }
    }

    function legacyCopyText(text) {
      var textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.setAttribute('readonly', '');
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      try {
        textArea.select();
        return document.execCommand('copy');
      } finally {
        document.body.removeChild(textArea);
      }
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (error) {
          // 某些浏览器虽然暴露 Clipboard API，但会因权限策略拒绝写入。
        }
      }

      return legacyCopyText(text);
    }

    async function copyKey() {
      // 复制前确保使用可信时间重新计算，绝不复制可能过期的 DOM 文本。
      await synchronizeTime(false);
      var otp = updateTOTP();
      scheduleNextUpdate();

      if (!otp) {
        showSnackbar('请先输入有效密钥');
        return;
      }

      try {
        if (!await copyText(otp)) {
          throw new Error('copy failed');
        }
        showSnackbar('已复制');
      } catch (error) {
        showSnackbar('复制失败，请手动复制');
      }
    }

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        clearTimeout(timerId);
      } else {
        resyncTOTP();
        synchronizeTime(false);
      }
    });
    window.addEventListener('focus', function () {
      resyncTOTP();
      synchronizeTime(false);
    });
    window.addEventListener('pageshow', function () {
      resyncTOTP();
      synchronizeTime(false);
    });
    window.addEventListener('online', function () {
      synchronizeTime(true);
    });

    // Base32解码
    function base32Decode(input) {
      var base32chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      var base32lookup = {};
      for (var i = 0; i < base32chars.length; i++) {
        base32lookup[base32chars.charAt(i)] = i;
      }
      
      input = input.replace(/=+$/, '');
      if (!input) {
        throw new Error('empty Base32 key');
      }

      var bits = '';
      var output = [];
      for (var i = 0; i < input.length; i++) {
        var char = input.charAt(i).toUpperCase();
        var val = base32lookup[char];
        if (val === undefined) {
          throw new Error('invalid Base32 character');
        }
        bits += ('00000' + val.toString(2)).slice(-5);
      }
      while (bits.length >= 8) {
        output.push(parseInt(bits.substring(0, 8), 2));
        bits = bits.substring(8);
      }
      
      return new Uint8Array(output);
    }

    // HMAC-SHA1哈希
    function hmacSHA1(key, message) {
      var keyBytes = new Uint8Array(key);
      var messageBytes = new Uint8Array(message);
      var hmacKey = (keyBytes.length > 64) ? sha1(keyBytes) : keyBytes;
      if (hmacKey.length < 64) {
        var padding = new Uint8Array(64 - hmacKey.length);
        hmacKey = concatenateUint8Arrays(hmacKey, padding);
      }

      var innerPad = new Uint8Array(64);
      var outerPad = new Uint8Array(64);
      for (var i = 0; i < 64; i++) {
        innerPad[i] = hmacKey[i] ^ 0x36;
        outerPad[i] = hmacKey[i] ^ 0x5c;
      }

      var innerHash = sha1(concatenateUint8Arrays(innerPad, messageBytes));
      var outerHash = sha1(concatenateUint8Arrays(outerPad, innerHash));

      return outerHash;
    }

    // SHA1哈希
    function sha1(message) {
      var sha1Hash = CryptoJS.SHA1(CryptoJS.lib.WordArray.create(message));
      return hexToBytes(sha1Hash.toString());
    }

    // 将十六进制字符串转换为字节数组
    function hexToBytes(hex) {
      var bytes = [];
      for (var i = 0; i < hex.length; i += 2) {
        bytes.push(parseInt(hex.substr(i, 2), 16));
      }
      return bytes;
    }

    // 合并Uint8Array
    function concatenateUint8Arrays(a, b) {
      var result = new Uint8Array(a.length + b.length);
      result.set(a);
      result.set(b, a.length);
      return result;
    }

    resyncTOTP();
    synchronizeTime(true);
  </script>

</body>
</html>
